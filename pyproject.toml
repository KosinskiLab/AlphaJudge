[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alphajudge"
version = "1.4.0"
description = "Evaluate AlphaFold-predicted protein complexes using confidence metrics and interface biophysics."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "biopython",
    "numpy",
    "scipy",
    "matplotlib",
]
license = { text = "MIT" }

authors = [
    { name = "Dima Molodenskiy" }
]

keywords = [
    "alphafold",
    "protein-complex",
    "structural-biology",
    "bioinformatics",
    "interface-scoring",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
]

[project.scripts]
alphajudge = "alphajudge.cli:main"
alphajudge-report = "alphajudge.report:main_aggregate"

[project.urls]
Homepage = "https://github.com/KosinskiLab/AlphaJudge"
Repository = "https://github.com/KosinskiLab/AlphaJudge"
Issues = "https://github.com/KosinskiLab/AlphaJudge/issues"

[tool.coverage.run]
source = ["src/alphajudge"]
branch = true
parallel = true

[tool.coverage.paths]
source = [
    "src/alphajudge",
    "*/site-packages/alphajudge",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
